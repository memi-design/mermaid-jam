name: Bug report
description: Report something that is broken or confusing
labels: [bug]
body:
  - type: textarea
    id: source
    attributes:
      label: Source input
      description: Paste the Mermaid or markdown that caused the issue.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Figma desktop/browser, OS, plugin version
